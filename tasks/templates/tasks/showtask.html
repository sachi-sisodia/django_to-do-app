{% extends 'tasks/base.html' %}
{% block content %}
<div class="container mt-5 px-40">
    <h2 class="heading">Add task</h2>

    <form action="" method="post">
        {% csrf_token %}
        {{form.as_p}}
        <div class="d-flex justify-content-center"> <input type="submit"  class="add-button-direct2 aligndiv" value="Submit"></div>
       
    </form>
    {% if messages %}
        {% for message in messages %}
        <small {% if messages.tags %} class="{{message.tags}}" {% endif %}>{{message}}</small>
        {% endfor %}
    {% endif %}
    <div class="add-button">
        <br>
        <a class="add-button-direct" href="{% url 'tasksummary' %}">See the listView</a>
    </div>
    <!-- <a href="{% url 'tasksummary' %}">See the listView</a> -->
</div>

{% endblock content %}
